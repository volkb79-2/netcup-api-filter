# Continuous Integration for netcup-api-filter
#
# Runs the non-browser unit/integration suite (tests/) with coverage on every
# push and pull request. The e2e-smoke job also runs the ci_smoke subset of the
# Playwright suite (ui_tests/) against a per-session app (ui_tests/e2e_env.py).
name: CI

on:
  push:
    branches: ["**"] # main + all feature branches
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint / compile (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      # Byte-compile the whole package: a cheap, dependency-free syntax gate
      # that fails fast on broken Python before we bother installing anything.
      - name: Byte-compile source
        run: python -m compileall -q src/netcup_api_filter

      # ruff is run only as an advisory step and only when it is actually a dev
      # dependency. If ruff is present in requirements-test.txt, it lints with
      # target-version=py311 (from ruff.toml).
      - name: Ruff (if available)
        run: |
          if grep -qiE '^ruff([<>=!~ ]|$)' requirements-test.txt; then
            python -m pip install --upgrade pip
            python -m pip install ruff
            ruff check src
          else
            echo "ruff not in requirements-test.txt; skipping lint."
          fi

  unit-tests:
    name: Unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      # Coverage flags (--cov=src/netcup_api_filter, term-missing + xml) come
      # from addopts in pytest.ini, so they are applied automatically here.
      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/

      - name: Upload coverage.xml
        if: always() # keep the report even if a test failed
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  e2e-smoke:
    name: E2E smoke (ui_tests/, ci_smoke)
    runs-on: ubuntu-latest

    # Mailpit captures the app's 2FA / invite mail. MP_SMTP_AUTH_ACCEPT_ANY lets
    # the app's "no auth" SMTP config deliver without credentials; the REST API
    # is unauthenticated (as in the ciu mailpit stack).
    services:
      mailpit:
        image: axllent/mailpit
        ports:
          - 8025:8025
          - 1025:1025
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "true"
          MP_SMTP_AUTH_ALLOW_INSECURE: "true"

    env:
      # Mailpit host for the golden DB's mock email config: build_deployment.py --local reads
      # SERVICE_MAILPIT (in the ciu stack it comes from .env.services). The app and Playwright run
      # on this same runner, so the service is reachable as localhost.
      SERVICE_MAILPIT: localhost
      # ui_tests/e2e_env.py starts its own per-session app from the deploy tree and tells the
      # browser to reach it here (in-process Playwright on the same host).
      NAF_E2E_ADVERTISE_HOST: 127.0.0.1
      # --- Mailpit REST client (ui_tests/mailpit_client.py) ---
      MAILPIT_URL: http://localhost:8025
      # Keep the per-session work dir (app logs) so a failed run can upload them.
      NAF_E2E_KEEP_WORKDIR: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # matches deploy target (.venv pyvenv.cfg -> 3.11.2)
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            ui_tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # App + unit-test deps, plus the ui_tests stack (playwright, httpx, ...).
          pip install -r requirements-test.txt -r ui_tests/requirements.txt playwright pytest-timeout

      - name: Install Playwright Chromium
        # In-process mode: installs browser binaries for local launch.
        # To offload to a Playwright-as-a-Service container instead, set
        # PLAYWRIGHT_SERVER_WS=ws://<service>:3000/ and skip this step.
        run: python -m playwright install --with-deps chromium

      # The same builder as `run-gate local-build`: deploy-local/ with the golden DB (only the
      # shipped admin, must_change_password=1, plus the Mailpit email config).
      - name: Build deploy tree (golden DB)
        run: python build_deployment.py --local --python-version 3.11 --build-dir deploy-local --output "$RUNNER_TEMP/deploy.zip"

      # No external app server: the e2e_environment session fixture starts the app on a copy of
      # the golden DB, provisions the personas and stops it again (ui_tests/e2e_env.py).
      - name: Run ci_smoke subset (serial)
        run: |
          PLAYWRIGHT_HEADLESS=true \
          python -m pytest -o addopts="" --timeout=120 -m ci_smoke ui_tests/tests -v

      - name: Collect Mailpit message dump (on failure)
        if: failure()
        run: |
          curl -fsS "$MAILPIT_URL/api/v1/messages" \
            > "$RUNNER_TEMP/mailpit-messages.json" 2>/dev/null || \
            echo '{"error":"could not reach mailpit"}' > "$RUNNER_TEMP/mailpit-messages.json"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-debug
          path: |
            /tmp/naf-e2e-*/*.log
            ${{ runner.temp }}/mailpit-messages.json
            tmp/ui-screenshots
          if-no-files-found: ignore
