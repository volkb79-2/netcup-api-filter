# Assay lane declarations for naf: the machine-readable test-rigor judge.
# The assay pin (version, vendored zipapp, SHA-256 sidecar) is single-sourced in
# run-gate.toml [assay]; this file never restates a version. Every lane is judged on the
# 3.14 runner (assay 12.0.0 cannot import on 3.11, assay backlog B229); the 3.11
# interpreter is gated by the plain pytest lane `unit-py311` in run-gate.toml.
#
# Lane families (generated shape, edit by hand freely):
#   unit            R0   the whole hermetic suite
#   <module>        R0+R1 whole-target line+branch floor on one security-relevant module
#   <module>_r3     R0+R1+R3 the same floor plus an import-break canary: the suite must go red
#                   when the module cannot be imported (proves the tests guard the module)
#   <module>_r2     R0+R2 native mutation of the module, narrow test selection, run async
#
# R1 floors are the MEASURED baseline, not a target: they only ratchet UP (raise fail_under
# with the tests that earn it; never lower it without a written reason). A floor of 100.0 on
# an `advisory` lane means "not measured yet".
schema_version = 2

# -o addopts="" drops pytest.ini's -x/--cov so each lane owns its own flags.
[lanes.unit]
scope = "S1"
rigor = ["R0"]
enforcement = "gate"
argv = ["python", "-m", "pytest", "tests", "-q", "-p", "no:cacheprovider", "-o", "addopts="]
env = {}
env_passthrough = ["PATH", "HOME", "PYTHONPATH", "PYTHONUNBUFFERED"]
budget = "30m"
allow_argv_append = false

# measured 2026-11-05: 163/216 lines, 65/86 branches
[lanes.token_auth]
scope = "S1"
rigor = ["R0", "R1"]
enforcement = "gate"
argv = ["python", "-m", "pytest", "tests", "-q", "-p", "no:cacheprovider", "-o", "addopts=", "--cov=netcup_api_filter.token_auth", "--cov-branch", "--cov-report=json:.assay/coverage-token_auth.json"]
env = {}
env_passthrough = ["PATH", "HOME", "PYTHONPATH", "PYTHONUNBUFFERED"]
budget = "30m"
allow_argv_append = false

[lanes.token_auth.isolation]
snapshot_selection = "repository"

[lanes.token_auth.judge]
language = "python"
source_roots = ["src"]
fail_under = 75.0
allow_excluded = false
require_branch = true
mode = "whole_target"
targets = ["src/netcup_api_filter/token_auth.py"]

[lanes.token_auth.judge.coverage]
format = "coverage-py-json"
artifact = ".assay/coverage-token_auth.json"

# measured 2026-11-05: 163/216 lines, 65/86 branches
[lanes.token_auth_r3]
scope = "S1"
rigor = ["R0", "R1", "R3"]
enforcement = "gate"
argv = ["python", "-m", "pytest", "tests", "-q", "-p", "no:cacheprovider", "-o", "addopts=", "--cov=netcup_api_filter.token_auth", "--cov-branch", "--cov-report=json:.assay/coverage-token_auth.json"]
env = {}
env_passthrough = ["PATH", "HOME", "PYTHONPATH", "PYTHONUNBUFFERED"]
budget = "60m"
allow_argv_append = false

[lanes.token_auth_r3.isolation]
snapshot_selection = "repository"

[lanes.token_auth_r3.judge]
language = "python"
source_roots = ["src"]
fail_under = 75.0
allow_excluded = false
require_branch = true
mode = "whole_target"
targets = ["src/netcup_api_filter/token_auth.py"]

[lanes.token_auth_r3.judge.coverage]
format = "coverage-py-json"
artifact = ".assay/coverage-token_auth.json"
[lanes.token_auth_r3.judge.canary]
mechanism = "import-break"
target = "src/netcup_api_filter/token_auth.py"
budget_per_attempt = "20m"

# R2: narrow selection (modules that import token_auth), fail-fast; run asynchronously, serial.
[lanes.token_auth_r2]
scope = "S1"
rigor = ["R0", "R2"]
enforcement = "advisory"
argv = ["python", "-m", "pytest", "tests/test_token_auth_unit.py", "tests/test_realm_scope.py", "tests/test_validators_property.py", "-q", "-p", "no:cacheprovider", "-o", "addopts=", "-x"]
env = {}
env_passthrough = ["PATH", "HOME", "PYTHONPATH", "PYTHONUNBUFFERED"]
budget = "8h"
allow_argv_append = false

[lanes.token_auth_r2.isolation]
snapshot_selection = "repository"

[lanes.token_auth_r2.judge]
language = "python"
source_roots = ["src"]
mode = "whole_target"
targets = ["src/netcup_api_filter/token_auth.py"]

[lanes.token_auth_r2.judge.mutation]
jobs_max = 1
max_mutants = 1000
budget_per_candidate = "120s"
operators = ["python:compare-swap", "python:boolop-swap", "python:bool-const-flip", "python:falsy-swap"]

