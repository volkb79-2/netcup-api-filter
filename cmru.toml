# cmru.toml — CMRU 7.x project config for netcup-api-filter (naf).
# One tagged release publishes the self-hosting OCI images (py311, py314) and the Passenger
# py311 tarball variant. NO SECRETS here: the GitHub token comes from the user's `gh` login.
schema_version = 1

[runtime]
kind = "none"

[env]
NAF_RELEASE_NOTES = "## netcup-api-filter\n\nScoped, audited DNS API in front of netcup and bring-your-own backends. Assets: `naf-v<ver>-py311.tar.xz` (Passenger webhosting, activate with `ciu up --host webhoster --thin -- --variant py311`) and the `app:py311` / `app:py314` container images."

[github]
owner = "volkb79-2"
repo = "netcup-api-filter"
owner_type = "user"
token_source = "gh"

[targets]
host = "github"
registry = ["ghcr.io"]

[project]
id = "naf"
description = "Scoped, audited DNS API filter: Passenger tarball + OCI images."
template_revision = 5
prefix = "naf-v"
artifacts = ["oci-image", "tarball"]

[project.version]
strategy = "scm"
bump = "conventional"

[project.release]
git_tag = true
build_step = "build"
artifact_dirs = ["dist"]

# Passenger deploys are GREENFIELD: each release ships a freshly seeded database; activation
# extracts it and carries ONLY the SECRET_KEY across (scripts/activate.py). So there is
# deliberately no `preserve` list.
[project.installer]
install_dir_system = "/srv/netcup-api-filter"
install_dir_user = "netcup-api-filter"
asset_suffix = ".tar.xz"
entrypoint = "scripts/activate.py"
required_commands = ["sh", "tar", "touch"]

# The Passenger bundle is built by cmru's bundle-build handler. The preflight resolves
# the declared variant's ciu runner and exports its checkout-local identity for [exec].
# tests/test_run_gate_pointers.py keeps this list, ciu runner variants, run-gate environments,
# bake targets, and the bundle/publish names in step.
[[project.variants]]
name = "py311"
build_arg = "PYTHON_VERSION=3.11"
label = "Passenger Python 3.11"

[steps.run-tests]
quiet = true
commands = [
  { label = "naf: release gate (unit py311/py314, trove, R1 floors, R3 canaries)", argv = ["run-gate", "release-gate", "--worktree", "."], cwd = "." },
  { label = "naf: resolved third-party versions still hold", argv = ["cmru", "versions", "check", "naf"], cwd = "." },
]

[steps.build]
quiet = true
commands = [
  { label = "naf: build Passenger bundle through cmru (inside this checkout's runner)", argv = ["bash", "-c", '''
unset NAF_BUNDLE_CMRU_CONFIG
cleanup_bundle_cmru_config() {
  case "${NAF_BUNDLE_CMRU_CONFIG:-}" in
    "$PWD"/.naf-bundle-cmru-*/cmru.toml)
      rm -rf -- "$(dirname -- "$NAF_BUNDLE_CMRU_CONFIG")"
      ;;
  esac
}
trap cleanup_bundle_cmru_config EXIT
naf_bundle_exports="$(python3 tooling/passenger_bundle_build.py prepare)" || exit $?
eval "$naf_bundle_exports" || exit $?
rm -f -- dist/naf-v*.tar.xz
cmru handler bundle-build --bundle-config bundle.toml --cmru-config "$NAF_BUNDLE_CMRU_CONFIG" --name naf --variant all || exit $?
bundle_archives=(dist/naf-v"${NAF_VERSION}"-*.tar.xz)
if [ -f "${bundle_archives[0]}" ]; then
  rm -rf -- dist/app
fi
'''], cwd = "." },
]

[steps.push]
quiet = true
commands = [
  { label = "naf: push OCI images (py311, py314)", argv = ["cmru", "handler", "oci-image-push", "--cwd", ".", "--bake-file", "docker-bake.hcl", "--bake-target", "release"], cwd = "." },
  { label = "naf: publish declared Passenger tarball variants", argv = ["python3", "tooling/passenger_bundle_publish.py"], cwd = "." },
]

# --- third-party versions (age window: adopt only releases at least 7 days old) -------------
[versions]
age_window_days = 7

[versions.discovery]
scope = "shipped"

[versions.targets]

[versions.targets."oci.mailpit"]
mode = "single"
constraint = ">=1.20.0,<2.0.0"

[versions.targets."oci.mailpit".oci]
image = "ghcr.io/axllent/mailpit"
tag = "v{version}"

[versions.targets."oci.mailpit".resolved]
version = "1.33.0"
resolved_at = "2026-11-13T11:52:27Z"
age_cutoff = "2026-11-06T11:52:27Z"

[versions.targets."oci.mailpit".resolved.sources]

[versions.targets."oci.mailpit".resolved.sources.oci]
version = "1.33.0"
released_at = "2026-10-31T02:30:23Z"
age_source = "oci-image-created-fallback"
tag = "v1.33.0"

[versions.targets."oci.powerdns-auth"]
mode = "single"
constraint = ">=5.1.0,<5.2.0"

[versions.targets."oci.powerdns-auth".oci]
image = "docker.io/powerdns/pdns-auth-51"
tag = "{version}"
username_env = "DOCKERHUB_USERNAME"
password_env = "DOCKERHUB_TOKEN"

[versions.targets."oci.powerdns-auth".resolved]
version = "5.1.5"
resolved_at = "2026-11-13T11:52:27Z"
age_cutoff = "2026-11-06T11:52:27Z"

[versions.targets."oci.powerdns-auth".resolved.sources]

[versions.targets."oci.powerdns-auth".resolved.sources.oci]
version = "5.1.5"
released_at = "2026-10-21T08:57:51Z"
age_source = "oci-image-created-fallback"
tag = "5.1.5"

[versions.targets."oci.python311"]
mode = "single"
constraint = ">=3.11.0,<3.12.0"

[versions.targets."oci.python311".oci]
image = "docker.io/library/python"
tag = "{version}-slim-trixie"
selection = "semver"
username_env = "DOCKERHUB_USERNAME"
password_env = "DOCKERHUB_TOKEN"

[versions.targets."oci.python311".resolved]
version = "3.11.17"
resolved_at = "2026-11-13T11:52:27Z"
age_cutoff = "2026-11-06T11:52:27Z"

[versions.targets."oci.python311".resolved.sources]

[versions.targets."oci.python311".resolved.sources.oci]
version = "3.11.17"
released_at = "2026-10-22T19:37:39Z"
age_source = "oci-image-created-fallback"
tag = "3.11.17-slim-trixie"

[versions.targets."oci.python314"]
mode = "single"
# The `-0` upper bound excludes 3.15 prereleases (for example 3.15.0rc1).
# A plain `<3.15.0` would admit such a pre-3.15 candidate under SemVer.
constraint = ">=3.14.0,<3.15.0-0"

[versions.targets."oci.python314".oci]
image = "docker.io/library/python"
tag = "{version}-slim-trixie"
selection = "semver"
username_env = "DOCKERHUB_USERNAME"
password_env = "DOCKERHUB_TOKEN"

[versions.targets."oci.python314".resolved]
version = "3.14.9"
resolved_at = "2026-11-13T11:52:27Z"
age_cutoff = "2026-11-06T11:52:27Z"

[versions.targets."oci.python314".resolved.sources]

[versions.targets."oci.python314".resolved.sources.oci]
version = "3.14.9"
released_at = "2026-10-24T06:04:16Z"
age_source = "oci-image-created-fallback"
tag = "3.14.9-slim-trixie"
