# cmru.toml — CMRU project config for netcup-api-filter (naf)
# =============================================================================
# Phase 2 of naf's cmru adoption (nyxloom-trove/CMRU-RELEASE-PLAN-2026-07-21.md):
# one tagged release publishes the py3.14 OCI image plus cp39/cp311 Passenger
# tarball variants.  The tarball builder is deliberately project-local: it is the
# only naf-specific part of the release flow.
#
# NO SECRETS here (this file is committed). The GitHub token is resolved at run
# time from $GITHUB_PUSH_PAT / $GITHUB_TOKEN, or a gitignored cmru.secret.toml
# overlay ([github].token) — see cmru SPEC S2.4.
# =============================================================================

[github]
owner      = "volkb79-2"
repo       = "netcup-api-filter"
owner_type = "user"          # matches vbpub/cmru.toml's owner_type for the same account
token_source = "gh"          # credential comes from the user's `gh auth` login

[targets]
host     = "github"
registry = ["ghcr.io"]

[project.naf]
prefix    = "naf-v"
artifacts = ["oci-image", "tarball"]
cwd       = "."

[project.naf.version]
strategy = "scm"

[project.naf.oci]
bake_file = "docker-bake.hcl"
target    = "py314"

# CMRU-FEAT: one tagged release, ABI-specific assets.  The build script
# reads these build args from this config and invokes the matching INFRA-3
# build image for each one; cmru's landed variant publisher gives them their
# canonical <tag>-<variant>.tar.xz release names.
[[project.naf.variants]]
name      = "py311"
build_arg = "PYTHON_VERSION=3.11"
label     = "Passenger Python 3.11"

# naf's Passenger deploy is GREENFIELD (matches the retired deploy.sh
# --preserve-secret-key): each release ships a freshly-seeded netcup_filter.db in
# the tarball, activation extracts it over the deploy root, and ONLY the SECRET_KEY
# is carried across (scripts/activate.py does this on the ciu --thin push path). So
# there is deliberately NO `preserve` list here — declaring the whole DB preserved
# would contradict the seeded-DB-per-release model.
[project.naf.installer]
install_dir_system = "/netcup-api-filter"
install_dir_user   = "netcup-api-filter"
asset_suffix       = ".tar.xz"
entrypoint         = "scripts/activate.py"
required_commands  = ["sh", "tar", "touch"]

[project.naf.steps.build]
commands = [
  { label = "build Passenger tarball variants in matching ABI containers", argv = ["python3", "scripts/build_webhosting_tarball.py", "build"], cwd = "." },
]

[project.naf.steps.push]
commands = [
  { label = "publish Passenger tarball variants", argv = ["python3", "scripts/build_webhosting_tarball.py", "publish"], cwd = "." },
]
