# =============================================================================
# naf gate orchestration: the SSOT for every lane, parsed by run-gate only.
# nyxloom-trove/nyxloom.toml [gates.*] are one-lane pointers into this file.
# Judgment (what a run proves) lives in assay.toml; the assay pin lives here.
# Runners: ciu-managed persistent test-runner-py311 / test-runner-py314
# (tooling/test-runner/); run-gate dispatches with `docker exec`, ciu owns
# build and lifecycle. Lane catalog: docs/TESTING_INFRASTRUCTURE.md.
# =============================================================================
schema_version = 1

[assay]
# Assay 12.0.0 does not import on Python 3.11 (assay backlog B229): the judge and every
# assay lane run on the 3.14 runner; 3.11 is gated by a plain pytest command lane.
environment = "test-runner-py314"
command = ["python3", "tools/assay/assay-12.0.0.pyz"]

[assay.pins.assay]
version = "12.0.0"
sha256 = "tools/assay/assay-12.0.0.pyz.sha256"

# One exec environment per shipped interpreter. 3.11 = Passenger webhosting,
# 3.14 = OCI image. state_root equals tooling/test-runner [test_runner.run_gate].
[environments.test-runner-py311]
image = "netcup-api-filter/test-runner:py311"
mode = "exec"
state_root = "/run-gate-state"
forward_env = ["CGROUP_PARENT_DEV_BACKGROUND", "PLAYWRIGHT_SERVER_WS",
    "MAILPIT_URL", "MAILPIT_API_URL", "MOCK_NETCUP_API_URL", "MOCK_GEOIP_API_URL", "PUBLIC_FQDN"]

[environments.test-runner-py314]
image = "netcup-api-filter/test-runner:py314"
mode = "exec"
state_root = "/run-gate-state"
forward_env = ["CGROUP_PARENT_DEV_BACKGROUND", "PLAYWRIGHT_SERVER_WS",
    "MAILPIT_URL", "MAILPIT_API_URL", "MOCK_NETCUP_API_URL", "MOCK_GEOIP_API_URL", "PUBLIC_FQDN"]

# Native R2 needs run-gate's cgroup observer, which a persistent exec runner cannot give
# (NO_MEASUREMENT/CGROUP_OBSERVATION_UNAVAILABLE): R2 lanes run in an ephemeral container of the
# same 3.14 image (assay B229: judged on 3.14). Limits are hints; the host owns the ceilings.
[environments.test-runner-r2]
image = "netcup-api-filter/test-runner:py314"
mode = "ephemeral"
user = "invoker"
cgroup_slice_env = "CGROUP_PARENT_DEV_GATES"

[environments.test-runner-r2.resources]
cpus = "2"

# --- hermetic suite (assay R0, one verdict per interpreter) -------------------
[lanes.unit-py311]
kind = "command"
environment = "test-runner-py311"
argv = ["bash", "-c", "cd {worktree} && python -m pytest tests -q -p no:cacheprovider -o addopts="]
clean_tree = false
budget = "30m"
description = "tests/ on python 3.11 (Passenger runtime); plain pytest verdict until assay runs on 3.11 (B229)"

[lanes.unit-py314]
kind = "assay"
environment = "test-runner-py314"
assay_lane = "unit"
clean_tree = false
description = "tests/ on python 3.14 (OCI image runtime), judged by assay lane 'unit'"

# --- whole-target R1 on the security boundary (advisory until measured) -------
[lanes.token_auth]
kind = "assay"
environment = "test-runner-py314"
assay_lane = "token_auth"
clean_tree = false
# The host CoW area is not mounted in the runner: plain file-copy snapshots (declared, not ambient).
resources = { cowtree = { mode = "off" } }

[lanes.account_auth]
kind = "assay"
environment = "test-runner-py314"
assay_lane = "account_auth"
clean_tree = false
# The host CoW area is not mounted in the runner: plain file-copy snapshots (declared, not ambient).
resources = { cowtree = { mode = "off" } }

[lanes.recovery_codes]
kind = "assay"
environment = "test-runner-py314"
assay_lane = "recovery_codes"
clean_tree = false
# The host CoW area is not mounted in the runner: plain file-copy snapshots (declared, not ambient).
resources = { cowtree = { mode = "off" } }

[lanes.utils]
kind = "assay"
environment = "test-runner-py314"
assay_lane = "utils"
clean_tree = false
# The host CoW area is not mounted in the runner: plain file-copy snapshots (declared, not ambient).
resources = { cowtree = { mode = "off" } }

# --- trove hygiene (interpreter-agnostic) ------------------------------------
[lanes.trove]
kind = "command"
environment = "test-runner-py311"
argv = ["bash", "-c", "cd {worktree} && /opt/tester-venv/bin/python tooling/test-runner/lint_trove.py"]
clean_tree = false
budget = "5m"

# --- local app build + e2e ---------------------------------------------------
# Local flow (all in containers; the cockpit only drives):
#   set -a; . ./.env.services; set +a            # service URLs (Mailpit/mocks) for the e2e lane
#   ciu up --dir tooling/mailpit; ciu up --dir tooling/geoip-mock; ciu up --dir tooling/netcup-api-mock
#   run-gate local-build --worktree "$PWD"      # deploy-local/ + its golden netcup_filter.db
#   run-gate e2e --worktree "$PWD"              # pwmcp is the estate instance, not ours
# The e2e lane needs NO running app and no target from the cockpit: every session starts its own
# throwaway app inside this runner on a copy of the golden DB and provisions personas into it
# (ui_tests/e2e_env.py, ui_tests/personas.py). tooling/app-local is the long-lived HUMAN instance.
[lanes.local-build]
kind = "command"
environment = "test-runner-py311"
argv = ["bash", "-c", "cd {worktree} && /opt/tester-venv/bin/python build_deployment.py --local --python-version 3.11 --build-dir deploy-local"]
clean_tree = false
budget = "15m"
description = "build + seed deploy-local/ and its golden DB (runs app code, so inside the 3.11 runner, never the cockpit)"

# 3.11 only: it exercises the built deploy tree. Not part of the `gate` sequence.
[lanes.e2e]
kind = "command"
environment = "test-runner-py311"
argv = ["bash", "-c", "cd {worktree} && /opt/tester-venv/bin/python -m pytest ui_tests/tests -q -p no:cacheprovider -o addopts="]
clean_tree = false
budget = "120m"


# --- R3 canaries (import-break): the suite must go red when the module cannot be imported ---
[lanes.token_auth_r3]
kind = "assay"
environment = "test-runner-py314"
assay_lane = "token_auth_r3"
clean_tree = false
resources = { cowtree = { mode = "off" } }

[lanes.account_auth_r3]
kind = "assay"
environment = "test-runner-py314"
assay_lane = "account_auth_r3"
clean_tree = false
resources = { cowtree = { mode = "off" } }

[lanes.recovery_codes_r3]
kind = "assay"
environment = "test-runner-py314"
assay_lane = "recovery_codes_r3"
clean_tree = false
resources = { cowtree = { mode = "off" } }

[lanes.utils_r3]
kind = "assay"
environment = "test-runner-py314"
assay_lane = "utils_r3"
clean_tree = false
resources = { cowtree = { mode = "off" } }


# --- R2 native mutation: asynchronous, serial, never a gate member (run: run-gate <m>_r2 --worktree $PWD) ---
[lanes.token_auth_r2]
kind = "assay"
environment = "test-runner-r2"
assay_lane = "token_auth_r2"
resource_observer = "cgprofile"
clean_tree = false
budget = "8h"

[lanes.token_auth_r2.resources]
memory = "2g"
pids = 8192

[lanes.token_auth_r2.resources.cowtree]
mode = "off"

[lanes.account_auth_r2]
kind = "assay"
environment = "test-runner-r2"
assay_lane = "account_auth_r2"
resource_observer = "cgprofile"
clean_tree = false
budget = "8h"

[lanes.account_auth_r2.resources]
memory = "2g"
pids = 8192

[lanes.account_auth_r2.resources.cowtree]
mode = "off"

[lanes.recovery_codes_r2]
kind = "assay"
environment = "test-runner-r2"
assay_lane = "recovery_codes_r2"
resource_observer = "cgprofile"
clean_tree = false
budget = "8h"

[lanes.recovery_codes_r2.resources]
memory = "2g"
pids = 8192

[lanes.recovery_codes_r2.resources.cowtree]
mode = "off"

[lanes.utils_r2]
kind = "assay"
environment = "test-runner-r2"
assay_lane = "utils_r2"
resource_observer = "cgprofile"
clean_tree = false
budget = "8h"

[lanes.utils_r2.resources]
memory = "2g"
pids = 8192

[lanes.utils_r2.resources.cowtree]
mode = "off"

# --- composite: the ship signal ----------------------------------------------
[lanes.gate]
kind = "sequence"
description = "Implementation gate: hermetic suite on both interpreters, then trove hygiene"
lanes = ["unit-py311", "unit-py314", "trove", "token_auth", "account_auth", "recovery_codes", "utils"]
stop_on = "FAIL"

# Release gate: the ship signal plus the R3 canaries. R2 is asynchronous and never a member.
[lanes.release-gate]
kind = "sequence"
description = "Release gate: gate + R3 canaries (R2 mutation runs asynchronously afterwards)"
lanes = ["gate", "token_auth_r3", "account_auth_r3", "recovery_codes_r3", "utils_r3"]
stop_on = "FAIL"
