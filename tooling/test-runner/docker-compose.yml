# GATING test-runner — persistent peer form.
#
# Two ways to run the gate:
#   * EPHEMERAL (`testing-exec.sh unit`) — `docker run --rm`. This is the form nyxloom
#     gates use: no prior `up` state, nothing to leak between attempts. Prefer it.
#   * PERSISTENT PEER (this file) — stays up on naf-dev-network so the suite can reach
#     the mock services (naf-mailpit, naf-mock-geoip, naf-mock-netcup-api) and a
#     deployed app as a peer, and so you can `docker exec` into a warm container.
#
# The image is python 3.11 (the Passenger deploy target), NOT the devcontainer's 3.14 —
# see the Dockerfile header. Never run the gating suite in the devcontainer.
#
# App DATA lives in the app/service containers — never mount service data dirs here;
# reach data through the service protocol (HTTP/SMTP).

services:
  test-runner:
    image: ${TEST_RUNNER_IMAGE:?TEST_RUNNER_IMAGE not set (source tooling/test-runner/runner.env)}
    build:
      context: ../..
      dockerfile: tooling/test-runner/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:?PYTHON_VERSION not set (source tooling/test-runner/runner.env)}
    container_name: ${TEST_RUNNER_CONTAINER:?TEST_RUNNER_CONTAINER not set (source tooling/test-runner/runner.env)}
    hostname: test-runner
    restart: unless-stopped
    # Run as the host-owned uid so bind-mounted files stay writable. The image gives this
    # uid a real passwd entry + HOME + XDG dirs (see Dockerfile) — a gate without a full
    # identity fails in ways that look like breakage but are pure environment.
    user: "${USER_UID:?USER_UID not set (check .env.workspace)}:${DOCKER_GID:?DOCKER_GID not set (check .env.workspace)}"
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      # Browser is ALWAYS external (pwmcp); no engine is installed in this image.
      - PLAYWRIGHT_SERVER_WS=${PLAYWRIGHT_SERVER_WS:-}
    volumes:
      # HOST path (DooD: the docker socket is the host's, so -v sources are host paths).
      - ${PHYSICAL_REPO_ROOT:?PHYSICAL_REPO_ROOT not set (check .env.workspace)}:/workspaces/netcup-api-filter:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
    working_dir: /workspaces/netcup-api-filter
    networks:
      - naf-network
    stdin_open: true
    tty: true
    labels:
      - "de.vxxu.volkb79.component=test-runner"
      - "de.vxxu.volkb79.stack=tooling"
      - "de.vxxu.volkb79.service-type=test"
      - "de.vxxu.volkb79.managed-by=manual"

networks:
  naf-network:
    external: true
    name: ${DOCKER_NETWORK_INTERNAL:?DOCKER_NETWORK_INTERNAL not set (check .env.workspace)}
